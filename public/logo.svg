<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Jet VPN</title>
  <desc id="desc">Белая угловатая стрелка на фиолетовом фоне</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#a20bd2"/>
      <stop offset="0.48" stop-color="#4d087f"/>
      <stop offset="1" stop-color="#160528"/>
    </linearGradient>
    <linearGradient id="paper" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#f4f5f8"/>
      <stop offset="1" stop-color="#c7cad4"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f1f5"/>
      <stop offset="0.56" stop-color="#aeb2bf"/>
      <stop offset="1" stop-color="#575b69"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="22" fill="url(#background)"/>
  <path d="M-8 26 78 0 96 0-8 46Z" fill="#d51cff" opacity=".16"/>
  <path d="M-10 78 96 34 96 45-10 91Z" fill="#1e0645" opacity=".5"/>
  <path d="M62 96 96 61 96 69 72 96Z" fill="#d51cff" opacity=".3"/>

  <!-- Lower folded streak -->
  <path d="M10 74 78 40 65 62 42 75Z" fill="url(#paper)"/>
  <path d="M10 74 42 75 65 62 48 82Z" fill="url(#shadow)"/>
  <path d="M42 75 65 62 48 82Z" fill="#737784"/>

  <!-- Main paper arrow -->
  <path d="M35 36 81 23 67 47 52 54 48 63 51 43Z" fill="url(#paper)"/>
  <path d="M35 36 51 43 48 63 43 51Z" fill="#dfe1e8"/>
  <path d="M48 63 52 54 67 47 59 54Z" fill="#9ca0ad"/>

  <!-- Sharp speed cuts -->
  <path d="M12 65 43 49 31 60Z" fill="#ffffff"/>
  <path d="M23 54 48 42 37 51Z" fill="#f6f7fa"/>
</svg>
