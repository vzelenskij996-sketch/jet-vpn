services:
  - type: web
    name: jet-vpn
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@jetvpn.local
      - key: ADMIN_PASSWORD
        sync: false
      # SITE_URL намеренно НЕ задан: Render сам подставляет PORT, а адрес сайта
      # становится известен только после первого деплоя. Пока переменная пуста,
      # сервер разрешает запросы с любого origin — сайт работает сразу.
      # Позже впишите реальный адрес: Dashboard -> Environment ->
      #   SITE_URL = https://<имя-сервиса>.onrender.com
