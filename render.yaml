services:
  - type: web
    name: jet-vpn
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@jetvpn.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: SITE_URL
        value: https://your-app-name.onrender.com
